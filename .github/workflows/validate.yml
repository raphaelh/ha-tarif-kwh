name: Validation

on:
  push:
  pull_request:
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read

jobs:
  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: home-assistant/actions/hassfest@master

  hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: hacs/action@main
        with:
          category: integration

  tests:
    name: tests (HA ${{ matrix.ha }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Dernière version de Home Assistant.
          # Python 3.14 : les versions récentes de HA (depuis 2026.3) n'acceptent plus 3.13.
          - ha: récente
            python: "3.14"
            paquet: pytest-homeassistant-custom-component
          # Version minimale annoncée dans hacs.json (2025.1) : HA 2025.1.4.
          - ha: "2025.1"
            python: "3.13"
            # pycares récent laisse un fil « safe shutdown » que le contrôle de fin de test de cette version refuse.
            paquet: "'pytest-homeassistant-custom-component==0.13.205' 'pycares<4.9'"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - run: pip install ${{ matrix.paquet }}
      - run: pytest -q
